spring:
  application:
    name: bank-heist-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankheist}
    username: ${DB_USERNAME:bankheist}
    password: ${DB_PASSWORD:bankheist}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
bankheist:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
