name: Verify game services

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Game, backend and real PostgreSQL integration tests
        run: bash mvnw -B -Pintegration verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: |
            BankHeist/target/surefire-reports/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  compose:
    needs: [java, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build services and wait for readiness
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
      - name: API and dashboard smoke checks
        run: |
          SMOKE_SAVE_STATE=/tmp/bankheist-smoke.json node scripts/smoke-api.mjs
          curl --fail --silent http://localhost:3000/ > /dev/null
      - name: Verify database persistence across service restart
        run: |
          docker compose stop
          docker compose up -d --wait --wait-timeout 120
          SMOKE_VERIFY_STATE=/tmp/bankheist-smoke.json node scripts/smoke-api.mjs
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail 100
      - name: Stop isolated CI services
        if: always()
        run: docker compose down
