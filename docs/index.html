<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Heist</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    #game-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Fit the 1600x896 canvas into the viewport while preserving aspect ratio. */
    #game {
      display: block;
      background: #000;
      outline: none;
      width: 100vw;
      height: calc(100vw * 896 / 1600);
      max-height: 100vh;
      max-width: calc(100vh * 1600 / 896);
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game" width="1600" height="896" tabindex="0"></canvas>
  </div>

  <script src="game.js"></script>
  <script>
    if (typeof main === "function") { main([]); }
  </script>
</body>
</html>
