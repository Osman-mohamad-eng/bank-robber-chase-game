apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: bankheist
spec:
  selector:
    app: bankheist-dashboard
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: bankheist
spec:
  replicas: 1

  selector:
    matchLabels:
      app: bankheist-dashboard

  template:
    metadata:
      labels:
        app: bankheist-dashboard

    spec:
      containers:
        - name: dashboard
          image: bankheist-dashboard:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"

            limits:
              memory: "128Mi"
              cpu: "250m"